services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: octap_dev
    ports:
      # Each developer can override the host port in their root .env.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - octap-postgres-data:/var/lib/postgresql/data
      # Supabase roles/auth.uid() the schema's RLS policies assume; see the file itself.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - octap-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  octap-postgres-data:
  octap-redis-data:
