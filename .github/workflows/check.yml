name: Checks
on:
  pull_request:
  # What lands on a protected branch is checked too: a direct push (an admin bypass) has no PR run.
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer commit supersedes a PR's run; every commit on dev or main keeps its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      # api-key.guard.ts needs this for rate limiting even in check:bootstrap
      # (it only has to be reachable, not populated with any data).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - name: MCP stdio CLI end-to-end test
        run: npm run test:mcp:e2e
      - run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: SDK demo regression tests
        run: npm run test:demo:sdk
      # Unit + integration in one run, so the coverage gate (vitest.config.ts thresholds) counts
      # the repositories exercised against real Postgres. Integration boots its own Postgres/Redis
      # testcontainers through the runner's Docker.
      - name: Integration tests + coverage gate
        run: npm run test:coverage
      - name: SDK demo against disposable API and database
        run: node scripts/sdk-demo-local.mjs
      - run: npm run check:bootstrap
      - run: npm run openapi:check

  # The deploy image (OCT-317): it builds, the migrations apply to an empty plain Postgres (the
  # shape RDS has) and apply again as a no-op, and the API it starts answers /health.
  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: octap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d octap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/octap
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: octap-core:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Migrations, twice
        run: |
          docker run --rm --network host -e DATABASE_URL octap-core:ci node scripts/migrate.mjs
          docker run --rm --network host -e DATABASE_URL octap-core:ci node scripts/migrate.mjs
      - name: API answers /health
        run: |
          docker run -d --name api --network host -e DATABASE_URL -e REDIS_URL -e SUI_NETWORK=testnet octap-core:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/health && exit 0; sleep 2; done
          docker logs api
          exit 1

  # infra/ (OCT-316): formatting and a validate of each root module, without AWS credentials or a
  # backend. `plan` against the real account comes with the deploy pipeline (OCT-322).
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
      - run: terraform fmt -check -recursive infra
      - name: Validate
        run: |
          for dir in infra/bootstrap infra/staging; do
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
          done
