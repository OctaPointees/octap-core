name: Checks
on: [push, pull_request]
jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      # api-key.guard.ts needs this for rate limiting/nonce checks even in check:bootstrap
      # (it only has to be reachable, not populated with any data).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      # Unit + integration in one run, so the coverage gate (vitest.config.ts thresholds) counts
      # the repositories exercised against real Postgres. Integration boots its own Postgres/Redis
      # testcontainers through the runner's Docker.
      - name: Integration tests + coverage gate
        run: npm run test:coverage
      - run: npm run check:bootstrap
